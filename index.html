<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Misfits PvM Random Race</title>
  <style>
    :root {
      /* Deep purple backgrounds */
      --bg-dark: #0a0512;
      --card-bg: #140924;
      --banner-purple: #230938;
      --border-purple: #3b1459;
      
      /* High-contrast colors for interactive elements */
      --card-inner-bg: #1d1b26;
      --accent-gold: #f59e0b;
      --accent-gold-hover: #d97706;
      --text: #ffffff;
      --text-muted: #a1a1aa;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 0;
    }

    /* Header Banner */
    .banner-container {
      width: 100%;
      background-color: var(--banner-purple);
      border-bottom: 3px solid var(--accent-gold);
      box-shadow: 0 4px 20px rgba(0,0,0,0.8);
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      height: 110px;
      overflow: hidden;
    }

    .banner-side {
      background: #e2e8f0;
      color: #000;
      width: 130px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      clip-path: polygon(0 0, 100% 0, 75% 100%, 0% 100%);
      z-index: 2;
      text-align: center;
    }

    .banner-side.right {
      background: #111827;
      color: #fff;
      clip-path: polygon(25% 0, 100% 0, 100% 100%, 0% 100%);
    }

    .banner-center {
      display: flex;
      align-items: center;
      gap: 20px;
      z-index: 2;
      flex: 1;
      justify-content: center;
    }

    .banner-title {
      font-size: 2.2rem;
      font-weight: 900;
      color: #d8b4fe;
      text-shadow: 2px 2px 6px rgba(0,0,0,0.9);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .banner-logo {
      width: 85px;
      height: 85px;
      background: var(--bg-dark);
      border-radius: 50%;
      border: 3px solid var(--accent-gold);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px rgba(245, 158, 11, 0.4);
    }

    .rules-btn {
      background: var(--accent-gold);
      color: #000;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.85rem;
      transition: background 0.2s, transform 0.1s;
      z-index: 2;
    }
    .rules-btn:hover { background: var(--accent-gold-hover); transform: scale(1.03); }

    /* Layout Structure */
    .content-wrapper {
      max-width: 1100px;
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      gap: 25px;
      padding: 30px 20px;
      justify-content: center;
    }

    /* Wheel Section */
    .wheel-section {
      background: var(--card-bg);
      border: 2px solid var(--border-purple);
      border-radius: 12px;
      padding: 25px;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1 1 400px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.7);
    }

    .wheel-wrapper {
      position: relative;
      margin: 15px 0;
    }

    .pointer {
      position: absolute;
      top: -15px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 15px solid transparent;
      border-right: 15px solid transparent;
      border-top: 25px solid #ef4444;
      z-index: 10;
      filter: drop-shadow(0 3px 6px rgba(0,0,0,0.8));
    }

    canvas {
      border-radius: 50%;
      border: 6px solid var(--accent-gold);
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
    }

    .controls {
      display: flex;
      gap: 8px;
      width: 100%;
      margin-top: 10px;
    }

    button.action-btn {
      padding: 12px 6px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: bold;
      background: var(--accent-gold);
      color: #000;
      border: none;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      flex: 1;
      text-transform: uppercase;
    }

    button.action-btn:hover:not(:disabled) { background: var(--accent-gold-hover); }
    button.action-btn:disabled { background: #27272a; color: #71717a; cursor: not-allowed; }

    .result-box {
      margin-top: 15px;
      padding: 15px;
      background: var(--card-inner-bg);
      border-radius: 8px;
      width: 100%;
      text-align: center;
      border: 1px solid #3f3f46;
      border-left: 4px solid var(--accent-gold);
    }

    .result-title { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .result-value { font-size: 1.2rem; font-weight: bold; color: #ffffff; margin-top: 4px; }

    /* Tracker Section */
    .tracker-section {
      background: var(--card-bg);
      border: 2px solid var(--border-purple);
      border-radius: 12px;
      padding: 25px;
      flex: 1 1 450px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.7);
    }

    .tracker-title {
      font-size: 1.2rem;
      color: var(--accent-gold);
      margin-bottom: 15px;
      border-bottom: 1px solid var(--border-purple);
      padding-bottom: 10px;
      text-transform: uppercase;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .challenge-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .challenge-card {
      background: var(--card-inner-bg);
      border-radius: 8px;
      padding: 12px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #27272a;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }

    .challenge-info { display: flex; flex-direction: column; }
    .challenge-num { font-size: 0.75rem; color: var(--accent-gold); font-weight: bold; }
    .challenge-text { font-size: 1rem; font-weight: bold; color: #ffffff; }
    
    .badge {
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 4px;
      color: #fff;
      display: inline-block;
      margin-top: 4px;
      width: fit-content;
      text-transform: uppercase;
      font-weight: bold;
    }

    .btn-sm { padding: 6px 12px; font-size: 0.8rem; border-radius: 4px; }
    .btn-unique { background: #16a34a; color: white; border: none; cursor: pointer; font-weight: bold; }
    .btn-unique:hover { background: #15803d; }

    /* Tier Badges */
    .badge-easy { background: #15803d; }
    .badge-medium { background: #1d4ed8; }
    .badge-hard { background: #c2410c; }
    .badge-insane { background: #b91c1c; }
    .badge-long { background: #6b21a8; }
  </style>
</head>
<body>

  <header class="banner-container">
    <div class="banner-side">
      <span>Start</span>
      <span style="font-size: 1.15rem; line-height: 1.1;">14<br>October</span>
      <span style="font-size: 0.7rem; color: #64748b;">00:00</span>
    </div>

    <div class="banner-center">
      <h1 class="banner-title">Misfits</h1>
      <div class="banner-logo">
        <svg viewBox="0 0 100 100" width="100%" height="100%">
          <circle cx="50" cy="50" r="45" fill="#0a0512" stroke="#f59e0b" stroke-width="4"/>
          <text x="50" y="55" fill="#f59e0b" font-size="13" font-weight="900" text-anchor="middle">PVM RACE</text>
        </svg>
      </div>
      <h1 class="banner-title">PvM Race</h1>
    </div>

    <button class="rules-btn" onclick="alert('Rules: Spin Tier -> Spin Boss -> Spin KC! Complete 9 challenges. Getting a Unique Drop auto-completes the challenge!')">Rules</button>

    <div class="banner-side right">
      <span>End</span>
      <span style="font-size: 1.15rem; line-height: 1.1;">14<br>November</span>
      <span style="font-size: 0.7rem; color: #cbd5e1;">00:00</span>
    </div>
  </header>

  <div class="content-wrapper">
    
    <!-- WHEEL SECTION -->
    <div class="wheel-section">

      <div class="wheel-wrapper">
        <div class="pointer"></div>
        <canvas id="wheelCanvas" width="320" height="320"></canvas>
      </div>

      <div class="controls">
        <button id="spinTierBtn" class="action-btn">1. Spin Tier</button>
        <button id="spinBossBtn" class="action-btn" disabled>2. Spin Boss</button>
        <button id="spinKcBtn" class="action-btn" disabled>3. Spin KC</button>
      </div>

      <div class="result-box">
        <div class="result-title" id="modeTitle">Step 1: Spin Tier</div>
        <div class="result-value" id="resultText">Click "1. Spin Tier" to start</div>
      </div>
      
      <button id="acceptBtn" class="action-btn" style="margin-top: 15px; width: 100%; display: none;">Add to Challenge List</button>
    </div>

    <!-- TRACKER SECTION -->
    <div class="tracker-section">
      <div class="tracker-title">Team Progress (9 Challenges)</div>
      <div class="challenge-list" id="challengeList"></div>
    </div>

  </div>

  <script>
    const TIERS = ['Easy', 'Medium', 'Hard', 'Insane', 'Long'];

    const PVM_DATA = {
      'Easy': {
        colorClass: 'badge-easy',
        kc: [100, 200, 300, 400, 500, 600],
        bosses: ['Kraken', 'Sire', 'Scurrius', 'DKings', 'Mole', 'Sarachnis', 'Moxy']
      },
      'Medium': {
        colorClass: 'badge-medium',
        kc: [50, 100, 150, 200, 250, 300],
        bosses: ['Vorkath', 'Duke', 'KQ', "K'ril", 'Titans']
      },
      'Hard': {
        colorClass: 'badge-hard',
        kc: [25, 50, 75, 100, 125, 150],
        bosses: ['Vardorvis', 'Muspah', 'Araxxor']
      },
      'Insane': {
        colorClass: 'badge-insane',
        kc: [16, 32, 48, 64, 80, 96],
        bosses: ['Corp', 'Nightmare', 'Gauntlet']
      },
      'Long': {
        colorClass: 'badge-long',
        kc: [5],
        bosses: ['FightCaves', 'Any Raid']
      }
    };

    const wheelColors = [
      '#15803d', '#b45309', '#0369a1', '#6d28d9', 
      '#047857', '#c2410c', '#1d4ed8', '#a16207'
    ];

    // STATE
    let wheelMode = 'tier'; // 'tier', 'boss', or 'kc'
    let currentItems = TIERS;
    let selectedTier = null;
    let selectedBoss = null;
    let selectedKC = null;
    let challenges = [];
    
    // CANVAS STATE
    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    let startAngle = 0;
    let spinTimeout = null;
    let spinAngleStart = 0;
    let spinTime = 0;
    let spinTimeTotal = 0;
    let isSpinning = false;

    // DOM ELEMENTS
    const spinTierBtn = document.getElementById('spinTierBtn');
    const spinBossBtn = document.getElementById('spinBossBtn');
    const spinKcBtn = document.getElementById('spinKcBtn');
    const acceptBtn = document.getElementById('acceptBtn');
    const resultText = document.getElementById('resultText');
    const modeTitle = document.getElementById('modeTitle');
    const challengeList = document.getElementById('challengeList');

    function drawWheel() {
      const numOptions = currentItems.length;
      const arc = Math.PI * 2 / numOptions;
      const outsideRadius = 150;
      const textRadius = 105;
      const insideRadius = 30;

      ctx.clearRect(0, 0, 320, 320);

      for (let i = 0; i < numOptions; i++) {
        const angle = startAngle + i * arc;
        ctx.fillStyle = wheelColors[i % wheelColors.length];

        ctx.beginPath();
        ctx.arc(160, 160, outsideRadius, angle, angle + arc, false);
        ctx.arc(160, 160, insideRadius, angle + arc, angle, true);
        ctx.stroke();
        ctx.fill();

        ctx.save();
        ctx.fillStyle = "#ffffff";
        ctx.shadowColor = "rgba(0,0,0,0.8)";
        ctx.shadowBlur = 4;
        ctx.translate(160 + Math.cos(angle + arc / 2) * textRadius, 
                      160 + Math.sin(angle + arc / 2) * textRadius);
        ctx.rotate(angle + arc / 2 + Math.PI / 2);
        const text = currentItems[i].toString();
        ctx.font = 'bold 13px sans-serif';
        ctx.fillText(text, -ctx.measureText(text).width / 2, 0);
        ctx.restore();
      }
    }

    function rotateWheel() {
      spinTime += 30;
      if (spinTime >= spinTimeTotal) {
        stopRotateWheel();
        return;
      }
      const spinAngle = spinAngleStart - easeOut(spinTime, 0, spinAngleStart, spinTimeTotal);
      startAngle += (spinAngle * Math.PI / 180);
      drawWheel();
      spinTimeout = setTimeout(rotateWheel, 30);
    }

    function stopRotateWheel() {
      clearTimeout(spinTimeout);
      const numOptions = currentItems.length;
      const degrees = startAngle * 180 / Math.PI + 90;
      const arcd = 360 / numOptions;
      const index = Math.floor((360 - degrees % 360) / arcd);
      
      const winningItem = currentItems[index];
      isSpinning = false;

      if (wheelMode === 'tier') {
        selectedTier = winningItem;
        modeTitle.innerText = "Step 2: Spin Boss";
        resultText.innerText = `Tier Spun: ${selectedTier}! Now spin Boss.`;
        spinTierBtn.disabled = true;
        spinBossBtn.disabled = false;
      } else if (wheelMode === 'boss') {
        selectedBoss = winningItem;
        modeTitle.innerText = "Step 3: Spin KC";
        resultText.innerText = `${selectedTier} -> ${selectedBoss}! Now spin KC.`;
        spinBossBtn.disabled = true;
        spinKcBtn.disabled = false;
      } else if (wheelMode === 'kc') {
        selectedKC = winningItem;
        modeTitle.innerText = "Challenge Ready!";
        resultText.innerText = `${selectedKC}x ${selectedBoss} (${selectedTier})`;
        spinKcBtn.disabled = true;
        acceptBtn.style.display = 'block';
      }
    }

    function easeOut(t, b, c, d) {
      const ts = (t /= d) * t;
      const tc = ts * t;
      return b + c * (tc + -3 * ts + 3 * t);
    }

    function startSpin(mode) {
      if (isSpinning) return;
      isSpinning = true;
      wheelMode = mode;
      
      if (mode === 'tier') {
        currentItems = TIERS;
        selectedTier = null;
        selectedBoss = null;
        selectedKC = null;
        acceptBtn.style.display = 'none';
      } else if (mode === 'boss') {
        currentItems = PVM_DATA[selectedTier].bosses;
      } else if (mode === 'kc') {
        currentItems = PVM_DATA[selectedTier].kc;
      }

      drawWheel();
      spinAngleStart = Math.random() * 10 + 10;
      spinTime = 0;
      spinTimeTotal = Math.random() * 3000 + 4000;
      rotateWheel();
    }

    // BUTTON EVENT LISTENERS
    spinTierBtn.addEventListener('click', () => startSpin('tier'));
    spinBossBtn.addEventListener('click', () => startSpin('boss'));
    spinKcBtn.addEventListener('click', () => startSpin('kc'));

    acceptBtn.addEventListener('click', () => {
      if (challenges.length >= 9) {
        alert('All 9 challenges have already been added!');
        return;
      }
      challenges.push({
        tier: selectedTier,
        badgeClass: PVM_DATA[selectedTier].colorClass,
        boss: selectedBoss,
        kc: selectedKC,
        status: 'In Progress'
      });
      renderChallenges();
      
      // Reset sequence back to Step 1
      spinTierBtn.disabled = false;
      acceptBtn.style.display = 'none';
      currentItems = TIERS;
      modeTitle.innerText = "Step 1: Spin Tier";
      resultText.innerText = "Challenge added! Spin Tier to start next challenge.";
      drawWheel();
    });

    function renderChallenges() {
      challengeList.innerHTML = '';
      for (let i = 0; i < 9; i++) {
        const item = challenges[i];
        const card = document.createElement('div');
        card.className = 'challenge-card';

        if (item) {
          card.innerHTML = `
            <div class="challenge-info">
              <span class="challenge-num">CHALLENGE #${i+1}</span>
              <span class="challenge-text">${item.kc}x ${item.boss}</span>
              <span class="badge ${item.badgeClass}">${item.tier} - ${item.status}</span>
            </div>
            <div class="action-btns">
              ${item.status === 'In Progress' ? `<button class="btn-sm btn-unique" onclick="completeChallenge(${i})">Unique Drop! 🎉</button>` : ''}
            </div>
          `;
        } else {
          card.innerHTML = `
            <div class="challenge-info">
              <span class="challenge-num">CHALLENGE #${i+1}</span>
              <span class="challenge-text" style="color: var(--text-muted); font-weight: normal;">Not spun yet...</span>
            </div>
          `;
        }
        challengeList.appendChild(card);
      }
    }

    window.completeChallenge = function(index) {
      challenges[index].status = 'COMPLETED! 🏆';
      renderChallenges();
    };

    // INIT
    drawWheel();
    renderChallenges();
  </script>
</body>
</html>
